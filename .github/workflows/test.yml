name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py auth.py claude_proxy.py config.py db.py runner.py
      - run: python -m unittest discover -s . -p "test*.py" -v
        env:
          WC_SESSION_SECRET: ci-only-session-secret-at-least-32-characters
          WC_PROXY_TOKEN: ci-only-proxy-token-at-least-32-characters
          WC_DB_PATH: /tmp/webconsole-ci.db
          WC_PROJECTS_ROOT: /tmp/webconsole-ci-projects
