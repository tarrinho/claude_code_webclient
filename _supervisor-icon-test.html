<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Supervisor Icon Ideas</title>
<style>
body { font-family: system-ui, sans-serif; padding: 2rem; background: #1e1e2e; color: #cdd6f4; }
h1 { font-size: 1.2rem; margin-bottom: 1.5rem; }
.row { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 2rem; }
.card { background: #313244; border-radius: 8px; padding: 1.5rem; text-align: center; min-width: 120px; }
.card .icon { font-size: 2rem; margin-bottom: 0.5rem; display: block; }
.card .label { font-size: 0.8rem; color: #a6adc8; }
.card code { display: block; font-size: 0.7rem; color: #6c7086; margin-top: 0.3rem; }
h2 { font-size: 1rem; margin-bottom: 1rem; color: #89b4fa; }
</style>
</head>
<body>
<h1>Supervisor Map Button — Icon Options</h1>

<h2>Emoji alternatives (replace 🗺)</h2>
<div class="row">
  <div class="card">
    <span class="icon">🧠</span>
    <span class="label">Radial Brain</span>
    <code>"🧠"</code>
  </div>
  <div class="card">
    <span class="icon">🕸</span>
    <span class="label">Web / Network</span>
    <code>"🕸"</code>
  </div>
  <div class="card">
    <span class="icon">📡</span>
    <span class="label">Hub / Radar</span>
    <code>"📡"</code>
  </div>
  <div class="card">
    <span class="icon">🔗</span>
    <span class="label">Connected</span>
    <code>"🔗"</code>
  </div>
  <div class="card">
    <span class="icon">👁</span>
    <span class="label">All-seeing</span>
    <code>"👁"</code>
  </div>
  <div class="card">
    <span class="icon">🧬</span>
    <span class="label">DNA / Tree</span>
    <code>"🧬"</code>
  </div>
</div>

<h2>Minimal SVG icons (recommended)</h2>
<div class="row">
  <div class="card">
    <span class="icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="3" fill="currentColor"/>
        <circle cx="12" cy="3" r="2" fill="currentColor"/>
        <circle cx="12" cy="21" r="2" fill="currentColor"/>
        <circle cx="3" cy="12" r="2" fill="currentColor"/>
        <circle cx="21" cy="12" r="2" fill="currentColor"/>
        <line x1="12" y1="5" x2="12" y2="9"/>
        <line x1="12" y1="15" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="9" y2="12"/>
        <line x1="15" y1="12" x2="19" y2="12"/>
      </svg>
    </span>
    <span class="label">Radial hub</span>
    <code>center node + 4 spokes</code>
  </div>
  <div class="card">
    <span class="icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
        <path d="M12 9.5V3"/>
        <circle cx="6" cy="18" r="1.5" fill="currentColor"/>
        <line x1="10.8" y1="10.2" x2="7.5" y2="16.5"/>
        <circle cx="18" cy="18" r="1.5" fill="currentColor"/>
        <line x1="13.2" y1="10.2" x2="16.5" y2="16.5"/>
      </svg>
    </span>
    <span class="label">Tree</span>
    <code>central trunk → branches</code>
  </div>
  <div class="card">
    <span class="icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/>
        <circle cx="12" cy="12" r="2" fill="currentColor"/>
        <circle cx="12" cy="3" r="1.2" fill="currentColor"/>
        <circle cx="20.5" cy="12" r="1.2" fill="currentColor"/>
        <circle cx="3.5" cy="12" r="1.2" fill="currentColor"/>
        <circle cx="12" cy="21" r="1.2" fill="currentColor"/>
      </svg>
    </span>
    <span class="label">Orbit</span>
    <code>orbital nodes ring</code>
  </div>
</div>
</body>
</html>
