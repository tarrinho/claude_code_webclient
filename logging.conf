[loggers]
keys=root,wc_app,wc_runner

[handlers]
keys=console,file

[formatters]
keys=default

[logger_root]
level=INFO
handlers=console,file

[logger_wc_app]
level=INFO
handlers=console,file
qualname=wc.app
propagate=0

[logger_wc_runner]
level=INFO
handlers=console,file
qualname=wc.runner
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=default
args=(sys.stdout,)

[handler_file]
class=logging.handlers.RotatingFileHandler
level=INFO
formatter=default
args=('/home/kali/projects/claude-code-webconsole/logs/webconsole.log', 'a', 10485760, 5)

[formatter_default]
format=%(asctime)s %(levelname)-8s %(name)s: %(message)s
datefmt=%Y-%m-%d %H:%M:%S