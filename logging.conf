[loggers]
keys=root,wc_app,wc_runner,wc_auth,wc_db,wc_turns,wc_supervisor,wc_sysstats,wc_transcripts

[handlers]
keys=console,file

[formatters]
keys=default

[logger_root]
level=INFO
handlers=console,file

[logger_wc_app]
level=INFO
handlers=console,file
qualname=wc.app
propagate=0

[logger_wc_runner]
level=INFO
handlers=console,file
qualname=wc.runner
propagate=0

[logger_wc_auth]
level=INFO
handlers=console,file
qualname=wc.auth
propagate=0

[logger_wc_db]
level=INFO
handlers=console,file
qualname=wc.db
propagate=0

[logger_wc_turns]
level=INFO
handlers=console,file
qualname=wc.turns
propagate=0

[logger_wc_supervisor]
level=INFO
handlers=console,file
qualname=wc.supervisor
propagate=0

[logger_wc_sysstats]
level=INFO
handlers=console,file
qualname=wc.sysstats
propagate=0

; transcripts.py logs the transcript repair pass, paging and usage extraction.
; It was reaching the file only by propagating to root, which is the arrangement
; registry #31 removed for wc.auth and wc.db: it works until someone sets a root
; handler differently, and it bypasses this file's per-logger levels entirely.
[logger_wc_transcripts]
level=INFO
handlers=console,file
qualname=wc.transcripts
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=default
args=(sys.stdout,)

[handler_file]
class=logging.handlers.RotatingFileHandler
level=INFO
formatter=default
; The filename is supplied at configure time from config.LOG_FILE, via
; fileConfig's `defaults`, so a server started by a test can write into its own
; directory instead of appending to the production log. Format strings below
; keep their own %(...)s tokens: fileConfig reads those with raw=True, so this
; interpolation pass does not touch them.
args=('%(logfile)s', 'a', 10485760, 5)

[formatter_default]
format=%(asctime)s %(levelname)-8s %(name)s: %(message)s
datefmt=%Y-%m-%d %H:%M:%S