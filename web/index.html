<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebConsole</title>
<link rel="icon" href="/assets/favicon.svg">
<style>
:root {
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#30363d;
  --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --accent2:#388bfd;
  --ok:#3fb950; --bad:#f85149; --warn:#d29922; --input-bg:#0d1117;
  --user-bg:#1f6feb; --user-fg:#fff; --assistant-bg:#1c2230;
  --sidebar-w:280px;
}
html[data-theme="light"] {
  --bg:#f6f8fa; --panel:#fff; --panel2:#eaeef2; --line:#d0d7de;
  --fg:#1f2328; --muted:#59636e; --accent:#0969da; --accent2:#0550ae;
  --ok:#1a7f37; --bad:#cf222e; --warn:#9a6700; --input-bg:#f6f8fa;
  --user-bg:#0969da; --assistant-bg:#f0f1f2;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}
button,input,textarea{font:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{touch-action:manipulation}

/* Sidebar */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90}
.sidebar-shell{width:var(--sidebar-w);height:100dvh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.sidebar-mobile{position:fixed;left:0;top:0;z-index:100;transform:translateX(-100%);transition:transform .2s ease}
.sidebar-mobile.open{transform:translateX(0)}
.sidebar-desktop{display:none;position:fixed;inset:0 auto 0 0}
.sidebar-header{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);min-height:52px}
.sidebar-header h2{font-size:14px;font-weight:650}
.btn-icon,.theme-toggle,.btn-logout{min-height:34px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--fg);padding:5px 9px;cursor:pointer}
.btn-icon:hover,.theme-toggle:hover,.btn-logout:hover{border-color:var(--muted);background:var(--panel2)}
.btn-new{margin:12px 14px 8px;min-height:40px;border:0;border-radius:7px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.btn-new:hover{background:var(--accent2)}
.sidebar-search{padding:0 14px 8px}
.sidebar-search input{width:100%;min-height:38px;border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--input-bg);color:var(--fg);outline:none}
.sidebar-search input:focus{border-color:var(--accent)}
.chat-list{flex:1;overflow-y:auto;padding:2px 8px 16px}
.chat-section-label{padding:12px 10px 5px;color:var(--muted);font:700 10px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}
.chat-item{display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:7px;margin-bottom:2px}
.chat-item:hover,.chat-item:focus-within{background:var(--panel2)}
.chat-item.active{background:var(--panel2);box-shadow:inset 2px 0 var(--accent)}
.chat-open{flex:1;min-width:0;border:0;background:none;color:inherit;text-align:left;cursor:pointer;padding:4px}
.chat-title{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-meta{font-size:11px;color:var(--muted)}
.chat-actions{display:flex;opacity:.6}
.chat-item:hover .chat-actions,.chat-item:focus-within .chat-actions{opacity:1}
.chat-action{min-width:34px;min-height:34px;border:0;border-radius:5px;background:none;color:var(--muted);cursor:pointer}
.chat-action:hover{background:var(--line);color:var(--fg)}
.sidebar-empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:12px}

/* Main */
.main{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{min-height:52px;padding:8px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:var(--panel)}
.topbar h1{font-size:15px;font-weight:650;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ver{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted)}
#menuBtn{display:inline-flex;align-items:center;justify-content:center}
.workspace-strip{min-height:34px;padding:6px 16px;display:none;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:var(--bg);color:var(--muted);font:11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}
.workspace-path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run-state{margin-left:auto;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.run-state::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.run-state[data-state="ready"]::before{background:var(--ok)}
.run-state[data-state="working"]::before{background:var(--accent);animation:pulse 1.2s infinite}
.run-state[data-state="retrying"]::before{background:var(--warn);animation:pulse 1.2s infinite}
.run-state[data-state="failed"]::before{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.message{display:flex;align-items:flex-start;gap:10px;max-width:100%}
.message.user{flex-direction:row-reverse}
.msg-avatar{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.message.user .msg-avatar{background:var(--accent)}
.message.assistant .msg-avatar{background:var(--ok)}
.message-body{max-width:85%;min-width:0}
.msg-bubble{padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.message.user .msg-bubble{background:var(--user-bg);color:var(--user-fg);border-bottom-right-radius:4px}
.message.assistant .msg-bubble{background:var(--assistant-bg);border-bottom-left-radius:4px}
.msg-bubble pre{margin:8px -4px 2px;padding:10px 12px;border-radius:7px;background:rgba(0,0,0,.22);overflow-x:auto;white-space:pre}
.msg-bubble code{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
.msg-time{font-size:10px;color:var(--muted);padding:3px 4px 0}
.message.user .msg-time{text-align:right}
.message-tools{min-height:24px;display:flex;gap:3px;padding-top:2px;opacity:0}
.message:hover .message-tools,.message:focus-within .message-tools{opacity:1}
.message-tools button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:11px;padding:3px 5px}
.message-tools button:hover{color:var(--fg)}
.empty-state{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--muted);text-align:center;padding:32px}
.empty-state .icon{font-size:38px;opacity:.45}.empty-state strong{color:var(--fg);font-size:15px}.empty-state p{font-size:12px}

/* Composer */
.composer{display:none;border-top:1px solid var(--line);background:var(--panel);padding:10px 16px 12px}
.composer-inner{display:flex;gap:8px;align-items:flex-end;background:var(--input-bg);border:1px solid var(--line);border-radius:12px;padding:8px 9px 8px 12px}
.composer-inner:focus-within{border-color:var(--accent)}
#composerInput{flex:1;border:0;background:none;color:var(--fg);resize:none;max-height:150px;outline:none;padding:3px 0}
.btn-send{width:36px;height:36px;flex:none;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:16px}
.btn-send:hover{background:var(--accent2)}.btn-send:disabled{opacity:.45;cursor:not-allowed}.btn-send.stop{background:var(--bad)}
.composer-meta{display:flex;justify-content:space-between;gap:10px;min-height:20px;padding:4px 4px 0}
.composer-status{font-size:11px;color:var(--muted)}
.composer-hint{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted)}
.retry-btn{display:none;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:11px}

/* Dialogs and notices */
.toast-region{position:fixed;right:16px;bottom:90px;z-index:300;display:grid;gap:8px;width:min(360px,calc(100vw - 32px))}
.toast{padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:7px;background:var(--panel);box-shadow:0 8px 28px rgba(0,0,0,.25)}
.toast.error{border-left-color:var(--bad)}
.dialog-backdrop{position:fixed;inset:0;z-index:400;display:none;place-items:center;padding:18px;background:rgba(0,0,0,.62)}
.dialog-backdrop.open{display:grid}
.dialog{width:min(430px,100%);border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.dialog h2{font-size:17px;margin-bottom:3px}.dialog>p{color:var(--muted);font-size:12px;margin-bottom:14px}
.dialog label{display:block;color:var(--muted);font-size:12px;margin:11px 0 4px}
.dialog input,.dialog textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 10px;color:var(--fg);background:var(--input-bg);outline:none}
.dialog textarea{min-height:72px;resize:vertical}.dialog input:focus,.dialog textarea:focus{border-color:var(--accent)}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn-secondary,.btn-primary{min-height:38px;border-radius:6px;padding:7px 13px;cursor:pointer}.btn-secondary{border:1px solid var(--line);background:transparent;color:var(--fg)}.btn-primary{border:1px solid var(--accent);background:var(--accent);color:#fff}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
@media(min-width:768px){.sidebar-desktop{display:flex}.main{margin-left:var(--sidebar-w)}#menuBtn{display:none}.messages{padding:24px 40px}}
@media(pointer:coarse){.btn-icon,.theme-toggle,.btn-logout,.btn-send{min-width:44px;min-height:44px}.chat-actions,.message-tools{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar-shell sidebar-mobile" id="sidebar" aria-label="Conversations" aria-hidden="true">
  <div class="sidebar-header"><h2>Conversations</h2><button class="btn-icon" id="sidebarCloseBtn" aria-label="Close conversations">&times;</button></div>
  <button class="btn-new new-chat-btn">＋ New conversation</button>
  <div class="sidebar-search"><label for="chatSearch" hidden>Search conversations</label><input id="chatSearch" type="search" placeholder="Search conversations"></div>
  <div class="chat-list" id="chatList"></div>
</nav>
<aside class="sidebar-desktop" aria-label="Conversations">
  <div class="sidebar-shell">
    <div class="sidebar-header"><h2>Conversations</h2></div>
    <button class="btn-new new-chat-btn">＋ New conversation</button>
    <div class="sidebar-search"><label for="chatSearchDesktop" hidden>Search conversations</label><input id="chatSearchDesktop" type="search" placeholder="Search conversations"></div>
    <div class="chat-list" id="chatListDesktop"></div>
  </div>
</aside>
<main class="main">
  <header class="topbar">
    <button class="btn-icon" id="menuBtn" aria-label="Open conversations">☰</button>
    <h1 id="topbarTitle">WebConsole</h1>
    <span class="ver">0.1.0</span>
    <button class="btn-icon" id="editChatBtn" aria-label="Edit conversation" title="Edit conversation" hidden>✎</button>
    <button class="theme-toggle" id="themeToggle" aria-label="Switch color theme" aria-pressed="false">◐</button>
    <button class="btn-logout" id="logoutBtn">Log out</button>
  </header>
  <div class="workspace-strip" id="workspaceStrip">
    <span class="workspace-path" id="workspacePath"></span>
    <span class="run-state" id="runState" data-state="ready">Ready</span>
  </div>
  <section class="messages" id="messagesArea" aria-label="Conversation">
    <div class="empty-state" id="emptyState"><div class="icon">⌁</div><strong>Start from a workspace</strong><p>Create or choose a conversation to begin.</p><button class="btn-primary new-chat-btn">New conversation</button></div>
  </section>
  <section class="composer" id="composerArea" aria-label="Message composer">
    <div class="composer-inner">
      <textarea id="composerInput" rows="1" maxlength="8000" placeholder="Ask Claude to inspect, explain, or change something…" aria-label="Message"></textarea>
      <button class="btn-send" id="sendBtn" aria-label="Send message">➜</button>
    </div>
    <div class="composer-meta"><span class="composer-status" id="composerStatus" role="status" aria-live="polite"></span><span><button class="retry-btn" id="retryBtn">Retry</button> <span class="composer-hint">Enter to send · Shift+Enter for newline</span></span></div>
  </section>
</main>
<div class="toast-region" id="toastRegion" role="status" aria-live="polite"></div>
<div class="dialog-backdrop" id="chatDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <form class="dialog" id="chatForm">
    <h2 id="dialogTitle">New conversation</h2><p id="dialogHelp">Name the workspace so it is easy to find later.</p>
    <label for="chatTitleInput">Title</label><input id="chatTitleInput" maxlength="200" required autocomplete="off">
    <label for="chatDescriptionInput">Description <span aria-hidden="true">· optional</span></label><textarea id="chatDescriptionInput" maxlength="500"></textarea>
    <div class="dialog-actions"><button type="button" class="btn-secondary" id="dialogCancel">Cancel</button><button type="submit" class="btn-primary" id="dialogSave">Create conversation</button></div>
  </form>
</div>
<script>
var currentChatId=null,isStreaming=false,currentAbort=null,chatsCache=[],currentChat=null,lastFailedPrompt='',dialogMode='create',previousFocus=null,cliSessionsCache=[];
function byId(id){return document.getElementById(id)}
function storageGet(key){try{return localStorage.getItem(key)}catch(e){return null}}
function storageSet(key,value){try{localStorage.setItem(key,value)}catch(e){}}
function storageRemove(key){try{localStorage.removeItem(key)}catch(e){}}
function draftKey(id){return 'wc_draft_'+id}

window.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('.new-chat-btn').forEach(function(b){b.addEventListener('click',function(){openChatDialog('create')})});
  byId('sidebarOverlay').addEventListener('click',closeSidebar); byId('sidebarCloseBtn').addEventListener('click',closeSidebar);
  byId('menuBtn').addEventListener('click',openSidebar); byId('themeToggle').addEventListener('click',toggleTheme);
  byId('logoutBtn').addEventListener('click',handleLogout); byId('editChatBtn').addEventListener('click',function(){openChatDialog('edit')});
  byId('sendBtn').addEventListener('click',function(){if(isStreaming)stopStreaming();else sendMessage()});
  byId('retryBtn').addEventListener('click',retryLast); byId('dialogCancel').addEventListener('click',closeDialog); byId('chatForm').addEventListener('submit',saveChatDialog);
  byId('chatDialog').addEventListener('click',function(e){if(e.target===this)closeDialog()});
  ['chatList','chatListDesktop'].forEach(function(id){byId(id).addEventListener('click',handleChatListClick)});
  ['chatSearch','chatSearchDesktop'].forEach(function(id){byId(id).addEventListener('input',function(){syncSearch(this.value);renderChatLists()})});
  byId('composerInput').addEventListener('input',function(){autoResize(this);if(currentChatId)storageSet(draftKey(currentChatId),this.value)});
  byId('composerInput').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage()}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(byId('chatDialog').classList.contains('open'))closeDialog();else closeSidebar()}});
  applySavedTheme(); checkAuth();
});

async function apiFetch(url,options){var r=await fetch(url,Object.assign({credentials:'same-origin'},options||{}));if(r.status===401){location.href='/login';throw new Error('Session expired')}return r}
function showToast(message,type){var el=document.createElement('div');el.className='toast '+(type||'');el.textContent=message;byId('toastRegion').appendChild(el);setTimeout(function(){el.remove()},4500)}
function setRunState(label,state){byId('runState').textContent=label;byId('runState').dataset.state=state||'ready';byId('composerStatus').textContent=label==='Ready'?'':label}
function applySavedTheme(){var theme=storageGet('wc_theme')||'dark';document.documentElement.dataset.theme=theme;byId('themeToggle').setAttribute('aria-pressed',String(theme==='light'))}
function toggleTheme(){var next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;byId('themeToggle').setAttribute('aria-pressed',String(next==='light'));storageSet('wc_theme',next)}
function openSidebar(){previousFocus=document.activeElement;byId('sidebar').classList.add('open');byId('sidebar').setAttribute('aria-hidden','false');byId('sidebarOverlay').style.display='block';byId('chatSearch').focus()}
function closeSidebar(){byId('sidebar').classList.remove('open');byId('sidebar').setAttribute('aria-hidden','true');byId('sidebarOverlay').style.display='none';if(previousFocus&&document.body.contains(previousFocus))previousFocus.focus()}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,150)+'px'}

async function checkAuth(){
  try{var r=await apiFetch('/api/chats');if(!r.ok)throw new Error('Could not load conversations');var data=await r.json();chatsCache=data.chats||[]}catch(e){if(e.message!=='Session expired')showToast(e.message,'error')}
  try{var r2=await apiFetch('/api/sessions/claude');if(r2.ok){var data2=await r2.json();cliSessionsCache=(data2.sessions||[]).sort(function(a,b){return(b.startedAt||'').localeCompare(a.startedAt||'')})}else{cliSessionsCache=[]}}catch(e){cliSessionsCache=[]}
  renderChatLists()
}
async function loadChats(){try{var r=await apiFetch('/api/chats');if(!r.ok)throw new Error('Could not load conversations');chatsCache=(await r.json()).chats||[];renderChatLists()}catch(e){showToast(e.message,'error')}}
function syncSearch(value){byId('chatSearch').value=value;byId('chatSearchDesktop').value=value}
function renderChatLists(){var q=byId('chatSearch').value.trim().toLowerCase();['chatList','chatListDesktop'].forEach(function(id){renderOneChatList(byId(id),q)})}
function renderOneChatList(list,q){
  list.replaceChildren();
  // CLI sessions
  var cliFiltered=q?cliSessionsCache.filter(function(s){return(s.name||'').toLowerCase().includes(q)||(s.cwd||'').toLowerCase().includes(q)}):cliSessionsCache;
  if(cliFiltered.length){
    var heading=document.createElement('div');heading.className='chat-section-label';heading.textContent='CLI Sessions · '+cliFiltered.length;list.appendChild(heading);
    cliFiltered.forEach(function(s){
      var item=document.createElement('div');item.className='chat-item';item.dataset.chatId=s.id;item.dataset.cli='true';
      var open=document.createElement('button');open.type='button';open.className='chat-open';open.textContent='Resume conversation';
      var title=document.createElement('div');title.className='chat-title';title.textContent=s.name;title.title=s.name;
      var meta=document.createElement('div');meta.className='chat-meta';meta.textContent=s.kind==='interactive'?'Terminal':'Web';meta.title=formatAbsoluteTime(s.startedAt);
      open.append(title,meta);
      var actions=document.createElement('div');actions.className='chat-actions';
      var resumeBtn=document.createElement('button');resumeBtn.type='button';resumeBtn.className='chat-action';resumeBtn.dataset.action='resume-cli';resumeBtn.dataset.sessionId=s.id;resumeBtn.textContent='↗';resumeBtn.title='Open in WebConsole';resumeBtn.setAttribute('aria-label','Open '+s.name+' in WebConsole');
      actions.appendChild(resumeBtn);item.append(open,actions);list.appendChild(item);
    })
  }
  // Web chats
  var webFiltered=q?chatsCache.filter(function(c){return !c.archived&&(c.title||'').toLowerCase().includes(q)||(c.description||'').toLowerCase().includes(q)}):chatsCache.filter(function(c){return !c.archived});
  var webArchived=q?chatsCache.filter(function(c){return c.archived&&(c.title||'').toLowerCase().includes(q)}):chatsCache.filter(function(c){return c.archived});
  if(!webFiltered.length&&!webArchived.length&&!cliFiltered.length){
    var empty=document.createElement('div');empty.className='sidebar-empty';empty.textContent=q?'No matching sessions':'No sessions yet';list.appendChild(empty);return
  }
  if(webFiltered.length){
    var heading2=document.createElement('div');heading2.className='chat-section-label';heading2.textContent='Web Chats · '+webFiltered.length;list.appendChild(heading2);
    webFiltered.forEach(function(c){
      var item=document.createElement('div');item.className='chat-item'+(c.id===currentChatId?' active':'');item.dataset.chatId=c.id;item.dataset.cli='false';
      var open=document.createElement('button');open.type='button';open.className='chat-open';open.dataset.action='open';open.dataset.chatId=c.id;
      var title=document.createElement('div');title.className='chat-title';title.textContent=c.title;var meta=document.createElement('div');meta.className='chat-meta';meta.textContent=formatTime(c.updated_at);meta.title=formatAbsoluteTime(c.updated_at);open.append(title,meta);
      var actions=document.createElement('div');actions.className='chat-actions';var action=document.createElement('button');action.type='button';action.className='chat-action';action.dataset.action='archive';action.dataset.chatId=c.id;action.textContent='⌄';action.title='Archive';action.setAttribute('aria-label','Archive '+c.title);actions.appendChild(action);item.append(open,actions);list.appendChild(item)
    })
  }
  if(webArchived.length){
    var heading3=document.createElement('div');heading3.className='chat-section-label';heading3.textContent='Archived · '+webArchived.length;list.appendChild(heading3);
    webArchived.forEach(function(c){
      var item=document.createElement('div');item.className='chat-item';item.dataset.chatId=c.id;item.dataset.cli='false';
      var open=document.createElement('button');open.type='button';open.className='chat-open';open.disabled=true;
      var title=document.createElement('div');title.className='chat-title';title.textContent=c.title;var meta=document.createElement('div');meta.className='chat-meta';meta.textContent=formatTime(c.updated_at);meta.title=formatAbsoluteTime(c.updated_at);open.append(title,meta);
      var actions=document.createElement('div');actions.className='chat-actions';var action=document.createElement('button');action.type='button';action.className='chat-action';action.dataset.action='restore';action.dataset.chatId=c.id;action.textContent='↶';action.title='Restore';action.setAttribute('aria-label','Restore '+c.title);actions.appendChild(action);item.append(open,actions);list.appendChild(item)
    })
  }
}
function handleChatListClick(e){var button=e.target.closest('button[data-action]');if(!button)return;var action=button.dataset.action;
  if(action==='open')selectChat(button.dataset.chatId);
  else if(action==='archive')archiveChat(button.dataset.chatId,true);
  else if(action==='restore')archiveChat(button.dataset.chatId,false);
  else if(action==='resume-cli')resumeCliSession(button.dataset.sessionId)
}

function openChatDialog(mode){dialogMode=mode;previousFocus=document.activeElement;var editing=mode==='edit';byId('dialogTitle').textContent=editing?'Edit conversation':'New conversation';byId('dialogHelp').textContent=editing?'Update how this workspace appears in the list.':'Name the workspace so it is easy to find later.';byId('dialogSave').textContent=editing?'Save changes':'Create conversation';byId('chatTitleInput').value=editing&&currentChat?currentChat.title:'';byId('chatDescriptionInput').value=editing&&currentChat?(currentChat.description||''):'';byId('chatDialog').classList.add('open');setTimeout(function(){byId('chatTitleInput').focus()},0)}
function closeDialog(){byId('chatDialog').classList.remove('open');if(previousFocus&&document.body.contains(previousFocus))previousFocus.focus()}
async function saveChatDialog(e){e.preventDefault();var title=byId('chatTitleInput').value.trim(),description=byId('chatDescriptionInput').value.trim();if(!title){byId('chatTitleInput').focus();return}var save=byId('dialogSave');save.disabled=true;try{if(dialogMode==='create'){var r=await apiFetch('/api/chats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title,description:description||null})});if(!r.ok)throw new Error('Could not create conversation');var data=await r.json();closeDialog();await loadChats();await selectChat(data.id)}else{var r2=await apiFetch('/api/chats/'+currentChatId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title,description:description})});if(!r2.ok)throw new Error('Could not save conversation');closeDialog();await loadChats();await selectChat(currentChatId)}}catch(err){showToast(err.message,'error')}finally{save.disabled=false}}

async function selectChat(chatId){if(isStreaming&&chatId!==currentChatId){showToast('Stop the current response before switching conversations.');return}if(currentChatId)storageSet(draftKey(currentChatId),byId('composerInput').value);currentChatId=chatId;closeSidebar();try{var r=await apiFetch('/api/chats/'+chatId);if(!r.ok)throw new Error('Could not open conversation');var data=await r.json();currentChat=data.chat;byId('topbarTitle').textContent=currentChat.title;byId('workspaceStrip').style.display='flex';byId('workspacePath').textContent=currentChat.work_dir;byId('workspacePath').title=currentChat.work_dir;byId('editChatBtn').hidden=false;byId('composerArea').style.display='block';renderMessages(data.messages||[]);var draft=storageGet(draftKey(chatId))||'';byId('composerInput').value=draft;autoResize(byId('composerInput'));setRunState('Ready','ready');renderChatLists();byId('composerInput').focus()}catch(e){showToast(e.message,'error')}}
function showWelcome(){currentChatId=null;currentChat=null;byId('topbarTitle').textContent='WebConsole';byId('workspaceStrip').style.display='none';byId('editChatBtn').hidden=true;byId('composerArea').style.display='none';byId('messagesArea').innerHTML='<div class="empty-state"><div class="icon">⌁</div><strong>Start from a workspace</strong><p>Create or choose a conversation to begin.</p><button class="btn-primary new-chat-btn" onclick="openChatDialog(\'create\')">New conversation</button></div>';renderChatLists()}
async function archiveChat(id,archived){try{var r=await apiFetch('/api/chats/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({archived:archived})});if(!r.ok)throw new Error(archived?'Could not archive conversation':'Could not restore conversation');if(currentChatId===id)showWelcome();await loadChats();showToast(archived?'Conversation archived':'Conversation restored')}catch(e){showToast(e.message,'error')}}
async function resumeCliSession(sessionId){
  try{byId('composerStatus').textContent='Opening session…';setRunState('Opening…','working');
  var r=await apiFetch('/api/sessions/'+sessionId+'/resume',{method:'POST',headers:{'Content-Type':'application/json'}});
  if(!r.ok)throw new Error('Could not open session');
  var data=await r.json();closeSidebar();await loadChats();await selectChat(data.id);
  showSuccess('Opened session "'+data.title+'"');
  }catch(e){showToast(e.message,'error');setRunState('Ready','ready')}
}
function showSuccess(msg){var el=document.createElement('div');el.className='toast';el.textContent=msg;byId('toastRegion').appendChild(el);setTimeout(function(){el.remove()},4500)}

function renderMessages(messages){var area=byId('messagesArea');area.replaceChildren();if(!messages.length){var empty=document.createElement('div');empty.className='empty-state';empty.innerHTML='<strong>This workspace is ready</strong><p>Ask Claude to inspect, explain, or change something.</p>';area.appendChild(empty)}else messages.forEach(function(m){area.appendChild(createMessageEl(m.role,m.content,m.created_at))});scrollToBottom()}
function createMessageEl(role,content,time){var row=document.createElement('article');row.className='message '+role;var avatar=document.createElement('div');avatar.className='msg-avatar';avatar.textContent=role==='user'?'U':'✶';avatar.setAttribute('aria-hidden','true');var body=document.createElement('div');body.className='message-body';var bubble=document.createElement('div');bubble.className='msg-bubble';renderSafeText(bubble,content||'');body.appendChild(bubble);if(time){var stamp=document.createElement('div');stamp.className='msg-time';stamp.textContent=formatTime(time);stamp.title=formatAbsoluteTime(time);body.appendChild(stamp)}if(role==='assistant'&&content){var tools=document.createElement('div');tools.className='message-tools';var copy=document.createElement('button');copy.type='button';copy.textContent='Copy';copy.addEventListener('click',function(){copyText(content,copy)});tools.appendChild(copy);body.appendChild(tools)}row.append(avatar,body);return row}
function renderSafeText(container,text){container.replaceChildren();var parts=String(text).split(/```/);parts.forEach(function(part,i){if(i%2){var pre=document.createElement('pre'),code=document.createElement('code');var firstNewline=part.indexOf('\n');code.textContent=firstNewline>=0?part.slice(firstNewline+1):part;pre.appendChild(code);container.appendChild(pre)}else if(part)container.appendChild(document.createTextNode(part))})}
async function copyText(text,button){try{await navigator.clipboard.writeText(text);var old=button.textContent;button.textContent='Copied';setTimeout(function(){button.textContent=old},1200)}catch(e){showToast('Could not copy response','error')}}

async function sendMessage(forcedContent){var input=byId('composerInput'),content=(forcedContent||input.value).trim();if(!content||!currentChatId)return;if(isStreaming){stopStreaming();return}lastFailedPrompt='';byId('retryBtn').style.display='none';input.value='';storageRemove(draftKey(currentChatId));autoResize(input);var area=byId('messagesArea');var empty=area.querySelector('.empty-state');if(empty)empty.remove();area.appendChild(createMessageEl('user',content,new Date().toISOString()));scrollToBottom();isStreaming=true;setSendMode(true);setRunState('Connecting…','working');currentAbort=new AbortController();var assistantRow=null,assistantBubble=null,fullText='',hadError=false;
try{var r=await apiFetch('/api/chats/'+currentChatId+'/stream',{method:'POST',signal:currentAbort.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({content:content})});if(!r.ok){var errData=await r.json().catch(function(){return{}});throw new Error(errData.error||'Could not start response')}setRunState('Thinking…','working');var reader=r.body.getReader(),decoder=new TextDecoder(),buffer='';while(true){var read=await reader.read();if(read.done)break;buffer+=decoder.decode(read.value,{stream:true});var blocks=buffer.split('\n\n');buffer=blocks.pop();for(var i=0;i<blocks.length;i++){var line=blocks[i].split('\n').find(function(v){return v.startsWith('data: ')});if(!line)continue;var evt;try{evt=JSON.parse(line.slice(6))}catch(e){continue}if(evt.type==='text'){if(!assistantRow){assistantRow=createMessageEl('assistant','','');assistantBubble=assistantRow.querySelector('.msg-bubble');area.appendChild(assistantRow)}fullText+=evt.content||'';renderSafeText(assistantBubble,fullText);setRunState('Responding…','working');scrollToBottom()}else if(evt.type==='status'&&evt.status==='api_retry'){var delay=evt.retry_delay_ms?Math.ceil(evt.retry_delay_ms/1000):null;setRunState('Retry '+(evt.attempt||'?')+'/'+(evt.max_retries||'?')+(delay?' in '+delay+'s':'')+'…','retrying')}else if(evt.type==='error'){hadError=true;throw new Error(evt.error||'Claude failed')}else if(evt.type==='done'){setRunState('Ready','ready')}}}}
catch(err){if(err.name==='AbortError'){setRunState('Stopped','ready');showToast('Response stopped')}else{hadError=true;lastFailedPrompt=content;byId('retryBtn').style.display='inline';setRunState('Failed','failed');showToast(err.message,'error')}}finally{isStreaming=false;currentAbort=null;setSendMode(false);if(assistantRow&&!fullText)assistantRow.remove();await loadChats();if(!hadError){setRunState('Ready','ready');try{await refreshCurrentChat()}catch(e){}}}}
function setSendMode(streaming){var btn=byId('sendBtn');btn.classList.toggle('stop',streaming);btn.textContent=streaming?'■':'➜';btn.setAttribute('aria-label',streaming?'Stop response':'Send message');byId('composerInput').disabled=streaming}
function stopStreaming(){if(currentAbort)currentAbort.abort()}
function retryLast(){if(lastFailedPrompt)sendMessage(lastFailedPrompt)}
async function refreshCurrentChat(){if(!currentChatId)return;var r=await apiFetch('/api/chats/'+currentChatId);if(r.ok){var data=await r.json();currentChat=data.chat;renderMessages(data.messages||[])}}
async function handleLogout(){try{await fetch('/logout',{method:'POST',credentials:'same-origin'})}catch(e){}location.href='/login'}
function parseTime(iso){if(!iso)return null;var value=/Z$|[+-]\d\d:\d\d$/.test(iso)?iso:iso+'Z';var d=new Date(value);return isNaN(d.getTime())?null:d}
function formatTime(iso){var d=parseTime(iso);if(!d)return'';var diff=Math.max(0,(Date.now()-d.getTime())/1000);if(diff<60)return'just now';if(diff<3600)return Math.floor(diff/60)+'m ago';if(diff<86400)return Math.floor(diff/3600)+'h ago';if(diff<604800)return Math.floor(diff/86400)+'d ago';return d.toLocaleDateString()}
function formatAbsoluteTime(iso){var d=parseTime(iso);return d?d.toLocaleString():''}
function scrollToBottom(){var area=byId('messagesArea');requestAnimationFrame(function(){area.scrollTop=area.scrollHeight})}
</script>
</body>
</html>
