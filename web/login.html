<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebConsole — Login</title>
<link rel="icon" href="/assets/favicon.svg">
<script src="/assets/login.js"></script>
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --line: #30363d;
  --fg: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
  --ok: #3fb950; --bad: #f85149; --warn: #d29922;
  --input-bg: #0d1117; --input-border: #30363d;
}
html[data-theme="light"] {
  --bg: #f6f8fa; --panel: #ffffff; --line: #d0d7de;
  --fg: #1f2328; --muted: #59636e; --accent: #0969da;
  --ok: #1a7f37; --bad: #cf222e; --warn: #9a6700;
  --input-bg: #f6f8fa; --input-border: #d0d7de;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--fg);
  display: flex; align-items: center; justify-content: center; min-height: 100vh;
}
.login-card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 32px 28px; width: 100%; max-width: 340px;
}
.login-card h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.login-card .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: var(--muted); }
.field input {
  width: 100%; padding: 8px 10px; font-size: 14px; font-family: inherit;
  background: var(--input-bg); border: 1px solid var(--input-border);
  border-radius: 6px; color: var(--fg); outline: none;
}
.field input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(88,166,255,0.2); }
.btn {
  width: 100%; padding: 10px 16px; font-size: 14px; font-weight: 500; font-family: inherit;
  background: var(--accent); color: #fff; border: none; border-radius: 6px;
  cursor: pointer; transition: opacity .15s;
}
.btn:hover { opacity: 0.88; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.error-msg {
  color: var(--bad); font-size: 13px; margin-top: 12px;
  display: none; text-align: center;
}
.error-msg.visible { display: block; }
.theme-toggle {
  position: fixed; top: 12px; right: 12px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
  cursor: pointer; color: var(--fg); font-size: 14px;
}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">&#9683;</button>

<div class="login-card">
  <h1>WebConsole</h1>
  <p class="subtitle">Sign in to your session</p>
  <form id="loginForm">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit" id="submitBtn">Sign in</button>
    <div class="error-msg" id="errorMsg" role="alert" aria-live="assertive"></div>
  </form>
</div>

<p class="login-ver" id="loginVer" data-click="fetch-version">loading…</p>

</body>
</html>
